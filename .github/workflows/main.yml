name: Godot Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          export GODOT_TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$GODOT_TEMPLATES_DIR"
          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable/* "$GODOT_TEMPLATES_DIR/"
          fi
          ls -la "$GODOT_TEMPLATES_DIR"

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p "$HOME/.config/godot"
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Java home: $JAVA_PATH"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/gradle_build_directory = ""
          EOF

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-release "Android" ./build/android/MythDefense.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MythDefense-Android
          path: build/android/*.apk
