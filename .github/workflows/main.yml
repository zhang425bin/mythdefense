name: Godot Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          export GODOT_TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$GODOT_TEMPLATES_DIR"
          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable/* "$GODOT_TEMPLATES_DIR/"
          fi
          ls -la "$GODOT_TEMPLATES_DIR"

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p "$HOME/.config/godot"
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Java home: $JAVA_PATH"
          KEYSTORE_PATH="$HOME/.config/godot/debug.keystore"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$KEYSTORE_PATH" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000
          # Generate a base editor settings file so Godot can load it correctly
          godot --headless --editor --quit || true
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          echo "Settings path: $SETTINGS"
          ls -la "$SETTINGS"
          # Inject Android export settings
          python3 - <<PY
          import re
          path = "$SETTINGS"
          with open(path, "r") as f:
              txt = f.read()
          settings = [
              'export/android/android_sdk_path = "/usr/lib/android-sdk"',
              'export/android/java_sdk_path = "$JAVA_PATH"',
              'export/android/debug_keystore = "$KEYSTORE_PATH"',
              'export/android/debug_keystore_user = "androiddebugkey"',
              'export/android/debug_keystore_pass = "android"',
          ]
          for s in settings:
              key = s.split("=")[0].strip()
              if key in txt:
                  txt = re.sub(rf"{re.escape(key)}\\s*=.*", s, txt)
              else:
                  txt = txt.replace("[resource]", "[resource]\n" + s)
          with open(path, "w") as f:
              f.write(txt)
          PY
          cat "$SETTINGS"

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-release "Android" ./build/android/MythDefense.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MythDefense-Android
          path: build/android/*.apk
