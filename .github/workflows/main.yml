name: Godot Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          # godot-ci image already ships templates; verify location
          ls -la /root/.local/share/godot/export_templates/4.3.stable || true

      - name: Build Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-release "Android" ./build/android/MythDefense.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MythDefense-Android
          path: build/android/*.apk
